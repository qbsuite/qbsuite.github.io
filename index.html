<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qbsuite</title>
<style>
  /* palette shared with qb-td (app/css/td.css): warm off-white, soft charcoal dark */
  :root {
    --bg: #fafaf8;
    --fg: #1a1a1a;
    --muted: #71717a;
    --line: #e4e4e7;
    --link: #1d4ed8;
    --sel: #efefea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #232326;
      --fg: #e4e4e7;
      --muted: #a1a1aa;
      --line: #36363c;
      --link: #8fb0f5;
      --sel: #303036;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 72px 24px 64px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 32px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header p { color: var(--muted); }
  h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    padding-bottom: 8px;
  }
  section + section { margin-top: 40px; }
  .list { border-top: 1px solid var(--line); }
  .item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 10px;
    margin: 0 -10px;
    border-bottom: 1px solid var(--line);
    border-radius: 8px;
  }
  .item:hover { background: var(--sel); }
  .item .body { flex-grow: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .desc { color: var(--muted); font-size: 14px; }
  .join { font-size: 14px; white-space: nowrap; }
  .soon .name { color: var(--muted); }
  .pill {
    font-weight: 400;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 1px 8px;
    margin-left: 4px;
  }
  footer { margin-top: 48px; font-size: 14px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>qbsuite</h1>
    <p>Quizbowl tools</p>
  </header>

  <section>
    <h2>Tournament</h2>
    <div class="list">
      <div class="item">
        <div class="body">
          <a class="name" href="https://qbsuite.github.io/qb-td/app/">qb-td</a>
          <div class="desc">Game file collection, packets, live stats, YellowFruit export</div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>Scorekeeper</h2>
    <div class="list">
      <div class="item">
        <div class="body">
          <a class="name" href="https://qbsuite.github.io/qb-scorekeeper/app/">qb-scorekeeper</a>
          <div class="desc">Reads packets, takes buzzes, adjudicates, keeps score</div>
        </div>
        <a class="join" href="https://qbsuite.github.io/qb-scorekeeper/app/player.html">join room</a>
      </div>
      <div class="item">
        <div class="body">
          <a class="name" href="https://consensus-scorekeeper.github.io/">consensus-scorekeeper</a>
          <div class="desc">Scorekeeper and stats for Consensus tournaments</div>
        </div>
        <a class="join" href="https://consensus-scorekeeper.github.io/player.html">join room</a>
      </div>
    </div>
  </section>

  <!-- hidden for now: Misc (qb-semantic-search, qb-audio, qb-mirror, labeled questions)
  <section>
    <h2>Misc</h2>
    <div class="list">
      <div class="item">
        <div class="body">
          <a class="name" href="https://qbsuite.github.io/qb-semantic-search/app/">qb-semantic-search</a>
          <div class="desc">Semantic search over every qbreader clue, fully in-browser or in the cloud</div>
        </div>
      </div>
      <div class="item">
        <div class="body">
          <a class="name" href="https://huggingface.co/datasets/uild42/qb-audio">qb-audio</a>
          <div class="desc">Read-aloud audio for qbreader questions</div>
        </div>
      </div>
      <div class="item">
        <div class="body">
          <a class="name" href="https://github.com/qbsuite/qb-mirror">qb-mirror</a>
          <div class="desc">Local SQLite mirror of the qbreader database</div>
        </div>
      </div>
      <div class="item soon">
        <div class="body">
          <span class="name">labeled questions <span class="pill">soon</span></span>
          <div class="desc">qbreader questions with richer labels</div>
        </div>
      </div>
    </div>
  </section>
  -->

  <footer>
    <a href="https://github.com/qbsuite">github.com/qbsuite</a>
  </footer>
</div>
</body>
</html>
